[package]
name = "btc"
version = "0.1.0"
edition = "2021"
description = "Rust CLI for multi-agent orchestration over Claude Code"
license = "MIT"
repository = "https://github.com/user/btc"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# IDs and time
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"

# File operations
tempfile = "3"
fd-lock = "4"
notify = "7"

# Graph
petgraph = { version = "0.7", features = ["serde-1"] }

# HTTP / Bot
reqwest = { version = "0.12", features = ["json"] }
teloxide = { version = "0.13", features = ["macros"] }

# Notifications
notify-rust = "4"

# Process management
nix = { version = "0.29", features = ["signal", "process"] }
colored = "2"

# Home directory
dirs = "5"

# Cron
tokio-cron-scheduler = "0.13"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
